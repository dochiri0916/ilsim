plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

description = 'code-risk-analyzer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'

    implementation 'org.springframework.shell:spring-shell-starter:4.0.3'

    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.28.2'

    implementation libs.jev.typesafe

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.yaml:snakeyaml'
    implementation 'com.networknt:json-schema-validator:2.0.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('verifyConcurrencyProgress', Exec) {
    commandLine 'python3', 'scripts/render_concurrency_progress.py', '--check'
}
tasks.named('check') {
    dependsOn tasks.named('verifyConcurrencyProgress')
}
