<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ask 원격</title>
<style>
  :root { --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --accent: #2f6f4f; --warn: #a05a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #20201e; --text: #ececea; --muted: #a2a29c; --line: #34342f; --accent: #6cc196; --warn: #e0a050; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  h1 { font-size: 20px; margin: 4px 0; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  input, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  textarea { min-height: 90px; resize: vertical; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; margin-top: 8px; }
  button:disabled { opacity: .4; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; margin: 8px 0 0; max-height: 50vh; overflow: auto; }
  .muted { color: var(--muted); font-size: 14px; }
  .warn { color: var(--warn); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>ask 원격</h1>
  <section id="login">
    <h2>비밀번호</h2>
    <input id="password" type="password" autocomplete="current-password">
    <button id="enter">들어가기</button>
    <p id="login-error" class="warn"></p>
  </section>
  <div id="app" hidden>
    <section>
      <h2>PC 상태</h2>
      <div id="runner" class="muted">불러오는 중...</div>
      <div id="session"></div>
      <button id="approve" hidden>이 계획대로 실행 (승인)</button>
      <pre id="output"></pre>
    </section>
    <section>
      <h2>요청 보내기</h2>
      <textarea id="text" placeholder="예: 회원 탈퇴 기능 추가해줘"></textarea>
      <button id="send">보내기</button>
      <p id="queued" class="muted"></p>
    </section>
    <p id="error" class="warn"></p>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let password = '';
try { password = localStorage.getItem('ask-password') || ''; } catch (e) {}
let current = null;

async function api(path, body) {
  const response = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: Object.assign({ Authorization: 'Bearer ' + password }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  const value = await response.json().catch(() => ({}));
  if (response.status === 401) { logout(value.error); throw new Error(value.error); }
  if (!response.ok) throw new Error(value.error || '요청 실패');
  return value;
}

function ago(iso) {
  const seconds = Math.round((Date.now() - new Date(iso)) / 1000);
  return seconds < 60 ? seconds + '초 전' : seconds < 3600 ? Math.round(seconds / 60) + '분 전' : Math.round(seconds / 3600) + '시간 전';
}

function render(view) {
  const status = view.status;
  current = status && status.session;
  if (!status) {
    $('runner').textContent = 'PC 러너가 아직 연결되지 않았습니다';
  } else {
    const stale = Date.now() - new Date(status.seenAt) > 120000;
    $('runner').textContent = (status.busy ? '실행 중: ' + status.busy : '대기 중') + ' · ' + (status.project || '') + ' · ' + ago(status.seenAt)
      + (stale && !status.busy ? ' (PC가 꺼져 있을 수 있어요)' : '');
  }
  $('session').textContent = current ? '작업 ' + current.name + (current.phase ? ' · 단계 ' + current.phase : '') : '';
  $('approve').hidden = !(current && current.awaitingApproval && !(status && status.busy));
  $('output').textContent = status && status.last ? status.last.summary : '';
  $('queued').textContent = view.queued.length ? '보낸 명령 ' + view.queued.length + '개가 PC를 기다리는 중' : '';
}

async function refresh() {
  try { render(await api('/api/status')); $('error').textContent = ''; }
  catch (e) { $('error').textContent = e.message; }
}

function logout(message) {
  try { localStorage.removeItem('ask-password'); } catch (e) {}
  password = '';
  $('app').hidden = true; $('login').hidden = false;
  $('login-error').textContent = message || '';
}

$('enter').onclick = async () => {
  password = $('password').value;
  try {
    render(await api('/api/status'));
    try { localStorage.setItem('ask-password', password); } catch (e) {}
    $('login').hidden = true; $('app').hidden = false;
  } catch (e) { $('login-error').textContent = e.message; }
};
$('send').onclick = async () => {
  const text = $('text').value.trim();
  if (!text) return;
  try { await api('/api/command', { type: 'request', text }); $('text').value = ''; refresh(); }
  catch (e) { $('error').textContent = e.message; }
};
$('approve').onclick = async () => {
  if (!current || !confirm('이 계획대로 코드 변경을 실행할까요?')) return;
  try { await api('/api/command', { type: 'approve', session: current.name }); refresh(); }
  catch (e) { $('error').textContent = e.message; }
};
if (password) { $('login').hidden = true; $('app').hidden = false; refresh(); }
setInterval(() => { if (password && !document.hidden) refresh(); }, 10000);
</script>
</body>
</html>
