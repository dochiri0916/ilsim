plugins {
    id 'codenarc'
    id 'groovy'
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'maven-publish'
}

codenarc {
    configFile = file('config/codenarc/codenarc.xml')
    maxPriority1Violations = 0
    maxPriority2Violations = 0
    maxPriority3Violations = 0
}

tasks.withType(CodeNarc).configureEach {
    reports {
        html.required = true
        text.required = true
    }
}

group = 'com.dochiri'
version = '1.0.0'

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.0.26'
    implementation 'com.tngtech.archunit:archunit:1.3.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    plugins {
        lintConvention {
            id = 'com.dochiri.lint-convention'
            implementationClass = 'com.dochiri.convention.plugin.LintConventionPlugin'
            displayName = 'Dochiri Lint Convention'
            description = 'Convention plugin for Checkstyle, PMD, SpotBugs, ArchUnit, and AGENTS.md architecture conventions.'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check {
    dependsOn jacocoTestReport
    dependsOn jacocoTestCoverageVerification
}
