plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.dochiri'
version = '1.5.0'

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.0.26'
    implementation 'com.tngtech.archunit:archunit:1.3.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

gradlePlugin {
    plugins {
        lintConvention {
            id = 'com.dochiri.lint-convention'
            implementationClass = 'com.dochiri.convention.plugin.LintConventionPlugin'
            displayName = 'Dochiri Lint Convention'
            description = 'Convention plugin for Checkstyle, PMD, SpotBugs, ArchUnit, and CLAUDE.md conventions.'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

test {
    useJUnitPlatform()
}
