plugins {
    id 'codenarc'
    id 'groovy'
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

codenarc {
    configFile = file('config/codenarc/codenarc.xml')
    maxPriority1Violations = 0
    maxPriority2Violations = 0
    maxPriority3Violations = 0
}

tasks.withType(CodeNarc).configureEach {
    reports {
        html.required = true
        text.required = true
    }
}

group = 'io.github.dochiri0916'
version = '1.0.1'

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.0.26'
    implementation 'com.tngtech.archunit:archunit:1.3.0'
    implementation 'org.ow2.asm:asm:9.7.1'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    filesMatching('build-convention-version.properties') {
        expand(pluginVersion: project.version)
    }
}

gradlePlugin {
    website = 'https://github.com/dochiri0916/build-convention'
    vcsUrl = 'https://github.com/dochiri0916/build-convention.git'

    plugins {
        lintConvention {
            id = 'io.github.dochiri0916.build-convention'
            implementationClass = 'io.github.dochiri0916.buildconvention.plugin.LintConventionPlugin'

            displayName = 'Build Convention'
            description = 'Java/Spring architecture, testing, static analysis, and quality convention plugin.'
            tags.set(['java', 'spring', 'architecture', 'testing', 'quality'])

            compatibility(it) {
                features {
                    configurationCache = false
                    isolatedProjects = false
                }
            }
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn test

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check {
    dependsOn jacocoTestReport
    dependsOn jacocoTestCoverageVerification
}
