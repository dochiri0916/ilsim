spring:
  application:
    name: ilsim-server
  datasource:
    url: ${ILSIM_DB_URL:jdbc:mysql://127.0.0.1:3333/ilsim?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Seoul}
    username: ${ILSIM_DB_USER:ilsim}
    password: ${ILSIM_DB_PASSWORD:ilsim}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # 테이블은 각 저장소가 처음 쓸 때 만든다(DB 가 늦게 떠도 서버는 뜬다)
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: false
        jdbc.time_zone: UTC
  ai:
    mcp:
      server:
        name: ilsim
        version: 0.0.1
        protocol: STREAMABLE
server:
  port: 8080
  address: ${ILSIM_BIND:127.0.0.1}
  forward-headers-strategy: ${ILSIM_FORWARD_HEADERS:none}
  tomcat:
    remoteip:
      internal-proxies: "127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|::1|0:0:0:0:0:0:0:1"
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        secure: ${ILSIM_SECURE_COOKIE:false}
        same-site: lax
        name: ILSIM_SESSION
